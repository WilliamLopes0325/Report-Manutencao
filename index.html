<style>

/* Cole aqui todo o conteúdo do style.css */

/* RESET */

*{

    padding:0;
    box-sizing:border-box;

}

body{
    background:linear-gradient(

/* LAYOUT */

.container{
    display:grid;
    grid-template-columns:360px 1fr;
    gap:18px;

    min-height:95vh;

    width:95%;
    margin:0 auto;

/* CARDS */

.card{
    background:#ffffff;
    border-radius:20px;

    padding:20px;

    border-top:4px solid #2f64e3;

    box-shadow:
    0 10px 30px rgba(0,0,0,.15);
}

.preview{
    align-self:start;
}


.card h2{
    color:#0f2347;
    font-size:30px;
    margin-bottom:5px;
}

.card p{
    color:#5d6b87;
    margin-bottom:20px;
}

/* FORMULÁRIOS */

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    font-weight:700;
    color:#17335b;
    margin-bottom:6px;
    font-size:14px;
    letter-spacing:.5px;
}

input,
select,
textarea{
    width:100%;
    border:1px solid #cfd6e4;
    border-radius:14px;
    padding:12px 15px;
    font-size:14px;
}

input:focus,
select:focus,
textarea:focus{
    outline:none;
    border-color:#2f64e3;
}

textarea{
    resize:none;
    min-height:90px;
}

/* BOTÕES */
.grupo-botoes{
    display:flex;
    flex-direction:column;
    gap:15px;
    margin-top:20px;
}

button{
    border:none;
    cursor:pointer;
    border-radius:12px;
    transition:.3s;
}

.btn-principal{

    padding:16px;

    background:linear-gradient(

        #2f64e3,
        #0d47a1
    );

    color:white;
    font-size:16px;
    font-weight:700;
}

.btn-limpar{

    width:100%;

    padding:14px;

    background:#dc3545;

    color:white;

    font-size:15px;
    font-weight:700;

    border:none;
    border-radius:12px;
}

.btn-principal:hover{

}

.btn-secundario{
    background:#f4f6fb;

    padding:8px 14px;
    color:#17335b;
    font-weight:600;
}

.btn-secundario:hover{

.btn-copiar{

    padding:14px;

    color:white;

    font-size:15px;
    font-weight:700;

    border:none;
    border-radius:12px;
}

.btn-copiar:hover{
    background:#157347;

    transform:translateY(-2px);

    box-shadow:
    0 6px 15px rgba(25,135,84,.35);
}
.btn-assunto{

    width:100%;

    padding:14px;

    background:#7c3aed;

    color:white;

    font-size:15px;
    font-weight:700;

    border:none;
    border-radius:12px;
}

.btn-assunto:hover{

    background:#6d28d9;

    transform:translateY(-2px);

    box-shadow:
    0 6px 15px rgba(124,58,237,.35);
}

/* ÁREA DE PRÉVIA */

.preview-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.preview-header-right{
    display:flex;
    gap:10px;

/* E-MAIL */

.email{

    background:white;
}

/* CABEÇALHO DO REPORT */

.email-header{

}

.email-header h1{

}

.info-tags{

.tag{

/* CORPO DO EMAIL */

/* BLOCOS */
.bloco p{

.bloco ul{

.bloco-titulo{

}

/* INDICADORES */

.indicadores{

    gap:15px;

}

.indicador{
    background:#f4f8ff;
    border-left:5px solid #2f64e3;
    padding:12px;
    border-radius:10px;
    min-width:180px;
}

.indicador strong{
    display:block;
    font-size:24px;
    color:#2f64e3;
}

/* PENDÊNCIAS */

.pendencias{
    background:#fff9eb;

    padding:15px;
    border-radius:10px;
}

/* ATENÇÃO */

.atencao{

    border-radius:10px;

.btn-limpar:hover{

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>

let dadosExcel = [];

// CARREGAR EXCEL
document
    .getElementById("excel")
    .addEventListener("change", lerExcel);

function lerExcel(event) {

    const arquivo = event.target.files[0];

    if (!arquivo) return;

    const reader = new FileReader();

    reader.onload = function(e) {

        const data = new Uint8Array(e.target.result);

        const workbook =
            XLSX.read(data, { type: "array" });

        const nomeAba =
            workbook.SheetNames[0];

        const planilha =
            workbook.Sheets[nomeAba];

        dadosExcel =
            XLSX.utils.sheet_to_json(planilha);

        console.log("Excel carregado:");
        console.table(dadosExcel);

    };

    reader.readAsArrayBuffer(arquivo);
}

// SUA FUNÇÃO GERAR PREVIEW
function gerarPreview() {

    console.log("BOTÃO CLICADO");

    gerarBlocosPorLinha();

    const turno =
        document.getElementById("turno").value;

        let saudacao = "";

switch(turno){

    case "T1":
        saudacao = "Boa tarde.";
        break;

    case "T2":
        saudacao = "Bom dia.";
        break;

    case "T3":
        saudacao = "Bom dia.";
        break;
}

document.getElementById("saudacao")
    .innerText = saudacao;

document.getElementById("textoTurno")
    .innerText =
    `Segue report das atividades de manutenção do ${turno}.`;

    const observacoes =
        document.getElementById("observacoes").value;

    const pendencias =
        document.getElementById("pendencias").value;

    const dataInput =
    document.getElementById("data").value;

let dataFormatada = "";

if (dataInput) {

    const partes =
        dataInput.split("-");

    dataFormatada =
        `${partes[2]}/${partes[1]}/${partes[0]}`;
}

    document.getElementById("assunto").value =
    `Report Manutenção CFC - ${turno} - ${dataFormatada}`;

    document.getElementById("tituloEmail")
        .innerText =
        `REPORT MANUTENÇÃO CFC`;

    document.getElementById("dataPreview")
        .innerText =
        `Data: ${dataFormatada}`;

    document.getElementById("turnoPreview")
        .innerText =
        `Turno: ${turno}`;

    document.getElementById("previewObservacoes")
        .innerText =
        observacoes;

    document.getElementById("previewPendencias")
        .innerText =
        pendencias;

    // OBSERVAÇÕES
    document.getElementById("blocoObservacoes")
    .style.display =
    observacoes.trim() ? "block" : "none";

    // PENDÊNCIAS
    document.getElementById("blocoPendencias")
    .style.display =
    pendencias.trim() ? "block" : "none";
}
function converterDataParaInput(dataBR) {

    const partes = dataBR.split("/");

    return `${partes[2]}-${partes[1]}-${partes[0]}`;
}

function gerarCabecalhoImagem(texto) {

    const canvas =
        document.createElement("canvas");

    // ANTES
    // canvas.width = 1200;
    // canvas.height = 90;

    // DEPOIS
    canvas.width = 2200;
    canvas.height = 90;

    const ctx =
        canvas.getContext("2d");

    // Fundo azul
    ctx.fillStyle = "#3666d6";

    ctx.beginPath();

    if (ctx.roundRect) {

        ctx.roundRect(
            0,
            0,
            canvas.width,
            canvas.height,
            36
        );

    } else {

        ctx.rect(
            0,
            0,
            canvas.width,
            canvas.height
        );
    }

    ctx.fill();

    // Barra escura arredondada
    ctx.fillStyle = "#0f2d6b";

    if (ctx.roundRect) {

        ctx.beginPath();

        ctx.roundRect(
            0,
            0,
            30,
            canvas.height,
            [24, 0, 0, 24]
        );

        ctx.fill();

    } else {

        ctx.fillRect(
            0,
            0,
            28,
            canvas.height
        );
    }

// Texto
ctx.fillStyle = "#ffffff";

ctx.font =
    "700 42px Segoe UI";

ctx.textBaseline = "middle";

ctx.fillText(
    texto,
    60,
    canvas.height / 2
);


    return canvas.toDataURL(
        "image/png"
    );
}

function gerarBlocosPorLinha() {

    const container =
        document.getElementById("areas");

    if (!container) return;

    container.innerHTML = "";

    const grupos = {};

const turnoSelecionado =
    document.getElementById("turno").value;

const chamadosFiltrados =
    dadosExcel.filter(item => {

        const atendimento =
            item["Atendimentos"];

        if (!atendimento) return false;

        const horaTexto =
            atendimento.split(" ")[1];

        if (!horaTexto) return false;

        const partes =
            horaTexto.split(":");

        const hora =
            parseInt(partes[0]);

        const minuto =
            parseInt(partes[1]);

        const horario =
            (hora * 60) + minuto;

        // T1
        if (
            turnoSelecionado === "T1" &&
            horario >= 390 &&
            horario < 900
        ) {
            return true;
        }

        // T2
        if (
            turnoSelecionado === "T2" &&
            horario >= 900
        ) {
            return true;
        }

        // T3
        if (
            turnoSelecionado === "T3" &&
            horario < 390
        ) {
            return true;
        }

        return false;
    });


// ======================================
// PEGA A DATA DO PRIMEIRO ATENDIMENTO
// ======================================

if (chamadosFiltrados.length > 0) {

    const dataChamado =
        chamadosFiltrados[0]["Data"]
            .split(" ")[0];

    document.getElementById("data").value =
        converterDataParaInput(dataChamado);
}

chamadosFiltrados.forEach(item => {
        const linha =
            item["Linha"] || "SEM LINHA";

        if (!grupos[linha]) {

            grupos[linha] = {
                processos: new Set(),
                sintomas: new Set(),
                comentarios: []
            };
        }

        grupos[linha].processos.add(
        item["Processo"] || ""
);

        grupos[linha].sintomas.add(
        item["Sintoma"] || ""
);

        grupos[linha].comentarios.push(
        item["Comentario Tecnico"] || ""
        );

    });

    const linhasOrdenadas =
    Object.keys(grupos).sort((a, b) => {

        const numA =
            parseInt(a.replace(/\D/g, "")) || 0;

        const numB =
            parseInt(b.replace(/\D/g, "")) || 0;

        return numA - numB;
    });

for (const linha of linhasOrdenadas) {


let html = `

<div class="bloco">

    <div class="bloco-titulo">
        ${linha}
    </div>

    <div class="cabecalho-linha">

        <div class="cabecalho-item">
            Processo:
        </div>

        <div class="cabecalho-item">
            Sintomas:
        </div>

        <div class="cabecalho-item">
            Comentários Técnicos:
        </div>

    </div>
`;
const processos =
    [...grupos[linha].processos];

const sintomas =
    [...grupos[linha].sintomas];

const comentarios =
    grupos[linha].comentarios;

for(let i = 0; i < processos.length; i++){

    html += `

    <div class="linha-atendimento">

        <div class="processo-item">
            • ${processos[i] || ""}
        </div>

        <div class="sintoma-item">
            ${sintomas[i] || ""}
        </div>

        <div class="comentario-item">
            ${comentarios[i] || ""}
        </div>

    </div>
    `;
}

html += `
</div>
`;
        container.innerHTML += html;
    }
}

async function copiarAssunto() {

    try {

        const assunto =
            document.getElementById("assunto").value;

        await navigator.clipboard.writeText(
            assunto
        );

        alert(
            "✅ Assunto copiado!"
        );

    } catch (erro) {

        console.error(erro);

        alert(
            "Erro ao copiar assunto."
        );
    }
}

async function copiarReport() {

    try {

        const html =
            gerarHtmlOutlook();

        await navigator.clipboard.write([

            new ClipboardItem({

                "text/html":
                    new Blob(
                        [html],
                        { type: "text/html" }
                    )

            })

        ]);

        alert(
            "✅ Report copiado para Outlook!"
        );

    } catch (erro) {

        console.error(erro);

        alert(
            "Erro ao copiar report."
        );
    }
}
